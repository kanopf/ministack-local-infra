---
# Configuracao do MegaLinter — https://megalinter.io/latest/config-file/
# Gate de QUALIDADE + SEGURANCA. Usado pelo workflow
# .github/workflows/megalinter.yml.
#
# IMPORTANTE: usamos SOMENTE ENABLE_LINTERS (lista unica da verdade). Com
# ENABLE_LINTERS definido, rodam EXATAMENTE os linters abaixo e nada mais.
# (Nao use ENABLE junto: ENABLE liga a linguagem inteira e traz TODOS os
# linters dela, ignorando esta lista — foi o que inflou o primeiro relatorio.)

ENABLE_LINTERS:
  # ---- QUALIDADE ----
  - PYTHON_RUFF              # lint rapido (substitui flake8 + isort)
  - PYTHON_BLACK            # formatacao Python
  - TERRAFORM_TERRAFORM_FMT # formatacao HCL
  - TERRAFORM_TFLINT        # boas praticas Terraform
  - DOCKERFILE_HADOLINT     # boas praticas Dockerfile
  - BASH_SHELLCHECK         # analise estatica de shell (run.sh)
  - YAML_YAMLLINT           # docker-compose.yml, workflows
  - MARKDOWN_MARKDOWNLINT   # README.md, EXPLICACAO.md

  # ---- SEGURANCA ----
  - PYTHON_BANDIT           # SAST Python
  - REPOSITORY_CHECKOV      # AUTORIDADE de misconfig de IaC (Terraform + Docker)
  - REPOSITORY_TRIVY        # vulnerabilidades de dependencias + segredos
  - REPOSITORY_GITLEAKS     # segredos no historico/arquivos
  - REPOSITORY_SECRETLINT   # segredos (regras complementares)
  - REPOSITORY_TRUFFLEHOG   # segredos verificaveis

# Trivy foca em vulnerabilidades e segredos; a analise de misconfig de IaC fica
# a cargo do checkov (evita dupla contagem dos mesmos achados de S3/Dockerfile).
REPOSITORY_TRIVY_ARGUMENTS:
  - "--scanners"
  - "vuln,secret"

# Falha o job (exit != 0) quando algum erro for encontrado — trava o merge.
DISABLE_ERRORS: false

SHOW_ELAPSED_TIME: true
FLAVOR_SUGGESTIONS: false
PRINT_ALPACA: false

# Reporta o que consertaria, mas nao commita sozinho — voce revisa e aplica.
APPLY_FIXES: none

# Ignora artefatos e o state do Terraform (contem dados sensiveis; nao deve
# ser lintado nem escaneado por scanners de segredo/misconfig).
FILTER_REGEX_EXCLUDE: (\.git/|\.terraform/|\.tfstate|megalinter-reports/|__pycache__/|\.venv/)

# Relatorios gerados.
REPORTERS_MARKDOWN_TYPE: simple
SARIF_REPORTER: true
